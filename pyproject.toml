[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seamless-pdf"
version = "1.0.0"
description = "Edit PDFs so nobody can tell, plus 67 document tools, as a CLI, an MCP server and an Agent Skill for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/seamless_pdf/assets/fonts/*.txt"]
authors = [{ name = "Nishant Sirohi" }]
keywords = ["pdf", "pdf-editor", "mcp", "agent-skill", "claude", "ai-agents", "ocr", "e-invoice"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "pikepdf>=10.17.0",
    "pypdfium2>=5.14.0",
    "fonttools>=4.67.0",
    "reportlab>=5.0.1",
    "pdfplumber>=0.11.10",
    "pypdf>=6.20.1",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "pyhanko>=0.37.0",
    "cryptography>=50.0.2",
    "factur-x>=7.7",
    "segno>=1.6.6",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "markdown>=3.11.1",
    "numpy>=2.5.4",
]

[project.urls]
Homepage = "https://github.com/nishantsirohi23/seamless-pdf-skill"
Issues = "https://github.com/nishantsirohi23/seamless-pdf-skill/issues"

[project.optional-dependencies]
mcp = ["mcp>=2.3.0"]

[project.scripts]
seamless-pdf = "seamless_pdf.cli:main"
seamless-pdf-mcp = "seamless_pdf.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seamless_pdf = ["assets/fonts/*", "skill/seamless-pdf/*", "skill/seamless-pdf/**/*"]
